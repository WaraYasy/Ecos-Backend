# ==================================================================
# PERFIL PROD — Railway
# Las variables de base de datos las inyecta automáticamente
# el plugin PostgreSQL de Railway (PGHOST, PGPORT, PGDATABASE…).
# Las API keys se configuran manualmente en Railway > Variables.
# ==================================================================

# ── Base de datos ────────────────────────────────────────────────
# Railway expone DATABASE_URL con formato:
#   postgresql://user:pass@host:port/dbname
# Añadimos el prefijo jdbc: — el driver PostgreSQL parsea las
# credenciales directamente desde la URL.
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones — ajustado para el tier gratuito de Railway
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── Puerto — Railway asigna $PORT dinámicamente ───────────────────
server.port=${PORT:8080}

# ── JPA ──────────────────────────────────────────────────────────
spring.jpa.show-sql=false
