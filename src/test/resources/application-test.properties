# ==================================================================
# PERFIL TEST - application-test.properties
# La conexión a PostgreSQL la gestiona Testcontainers automáticamente
# via @ServiceConnection — no hace falta definir datasource.url aquí
# ==================================================================

# Hibernate no valida ni crea esquema en tests — Flyway lo gestiona en dev/prod
spring.jpa.hibernate.ddl-auto=none

# Sin SQL en consola durante tests (output más limpio)
spring.jpa.show-sql=false

# Ver qué migraciones ejecuta Flyway al levantar el contenedor
logging.level.org.flywaydb=INFO

# Reducir verbosidad de logs en tests
logging.level.org.springframework=WARN
logging.level.es.wara.ecos=INFO

# ------------------------------------------------------------------
# Credenciales dummy para tests
# Los tests no llaman a las APIs externas reales (usan mocks/WireMock)
# pero Spring necesita que las propiedades estén definidas para arrancar.
# En producción estos valores vienen del .env — aquí se sobreescriben.
# ------------------------------------------------------------------
spotify.client.id=test-spotify-id
spotify.client.secret=test-spotify-secret
spotify.redirect.uri=http://localhost/callback/spotify

lastfm.api.key=test-lastfm-key

tmdb.api.key=test-tmdb-key
tmdb.api.token=test-tmdb-token

encryption.key=test-encryption-key-for-tests
encryption.salt=deadbeefdeadbeef

jwt.secret=test-jwt-secret-key-minimum-256-bits-for-testing-purposes-only
cors.allowed.origins=http://localhost:3000

# ------------------------------------------------------------------
# Proxy HTTP — deshabilitado en tests
# Los tests de SpotifyClient usan MockRestServiceServer, que intercepta
# las peticiones a nivel de RestTemplate (sin red real), por lo que
# el proxy no es necesario ni deseable.
# Para tests futuros con WireMock: apuntar el proxy al servidor WireMock
# habilitando http.proxy.enabled=true y http.proxy.port={wireMockPort}
# en el propio test con @DynamicPropertySource.
# ------------------------------------------------------------------
http.proxy.enabled=false

# Rate limiting deshabilitado en tests para evitar 429 entre tests que comparten IP
rate.limit.enabled=false

# ------------------------------------------------------------------
# Gmail SMTP — valores dummy para tests
# El scheduler de limpieza inyecta JavaMailSender, que requiere estas
# propiedades definidas para que Spring cree el contexto correctamente.
# En tests no se envía email real; los tests funcionales no ejercitan
# el scheduler directamente.
# ------------------------------------------------------------------
spring.mail.username=test@example.com
spring.mail.password=test-mail-password
cleanup.report.to=test@example.com
# Deshabilitar schedulers durante tests para evitar deadlocks con TRUNCATE
oauth.cleanup.cron=-
spring.main.allow-bean-definition-overriding=true
