# ==================================================================
# CONFIGURACION PRINCIPAL - application.properties
# Valores comunes a todos los perfiles (dev, test, prod)
# Las credenciales se cargan desde el archivo .env (no se sube a Git)
# ==================================================================

# Perfil activo por defecto
spring.profiles.active=dev

# Server
server.port=3000

# JPA - Flyway gestiona el esquema, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator - solo exponer health públicamente
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/

# Credenciales de APIs externas (cargan desde .env)
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect.uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:3000/callback/spotify}

lastfm.api.key=${LASTFM_API_KEY}

tmdb.api.key=${TMDB_API_KEY}
tmdb.api.token=${TMDB_API_TOKEN}

# Cifrado AES-256 para tokens OAuth en BD (spring-security-crypto)
# ENCRYPTION_KEY  : contraseña libre, mín. 8 caracteres
# ENCRYPTION_SALT : exactamente 16 caracteres hexadecimales (ej: deadbeefdeadbeef)
encryption.key=${ENCRYPTION_KEY}
encryption.salt=${ENCRYPTION_SALT}

# JWT — autenticación stateless
# JWT_SECRET        : cadena aleatoria >= 32 caracteres (requerida)
# JWT_EXPIRATION_MS : duración del token en ms (default: 24h)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — orígenes permitidos (separados por coma)
# En producción: CORS_ALLOWED_ORIGINS=https://mi-frontend.vercel.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:5173}

# ==================================================================
# Proxy HTTP para peticiones a APIs externas (Spotify, Last.fm, TMDb, MusicBrainz)
# Cada perfil sobreescribe estos valores según el entorno.
# Por defecto deshabilitado — las peticiones van directas a las APIs.
# ==================================================================
http.proxy.enabled=false
http.proxy.host=localhost
http.proxy.port=8080
# http.proxy.user=     ← descomentar si el proxy requiere autenticación
# http.proxy.password= ← descomentar si el proxy requiere autenticación

# Logging (configurado en logback-spring.xml)