# ==================================================================
# PERFIL DEV - application-dev.properties
# PostgreSQL local via Docker (pgvector/pgvector:pg16)
# ==================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ecos_db
spring.datasource.username=${DB_USERNAME:ecos}
spring.datasource.password=${DB_PASSWORD:ecos1234}

# JWT — valor local de desarrollo (no usar en producción)
jwt.secret=${JWT_SECRET:ecos-local-dev-secret-key-32chars!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================================================
# Proxy HTTP — perfil DEV
# Deshabilitado por defecto. Para inspeccionar el tráfico a Spotify,
# Last.fm, etc. con mitmproxy o Charles Proxy:
#   1. Iniciar mitmproxy:  mitmproxy --listen-port 8888
#   2. Cambiar las líneas siguientes:
#        http.proxy.enabled=true
#        http.proxy.port=8888
# ==================================================================
http.proxy.enabled=false
http.proxy.host=localhost
http.proxy.port=8888

# Mostrar SQL en consola durante desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Micro IA local (descomenta cuando levantes el servidor FastAPI en local)
# ai.service.url=http://localhost:8001
# ai.service.api-key=dev-secret