# ==================================================================
# PERFIL PROD → Railway
# Todas las variables se configuran en Railway > Settings > Variables.
# ==================================================================

# Base de datos
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.es.wara.ecos.backend=DEBUG

# Pool de conexiones → ajustado para el tier gratuito de Railway (max 5 conexiones BD)
# connection-timeout: falla en 3s si no hay conexión disponible (evita requests colgadas)
# leak-detection-threshold: avisa en log si una conexión no se devuelve en 10s
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000

# Puerto → Railway asigna $PORT dinámicamente; 8080 como valor por defecto local
server.port=${PORT:8080}

# JPA
spring.jpa.show-sql=false

# Proxy HTTP corporativo
# Habilitar si el entorno de producción requiere salir a internet
# a través de un proxy corporativo (firewall empresarial).
# Variables a configurar en Railway > Settings > Variables:
#   PROXY_ENABLED
#   → true / false
#   PROXY_HOST     → hostname o IP del proxy
#   PROXY_PORT     → puerto (normalmente 3128 o 8080)
#   PROXY_USER     → usuario (solo si el proxy requiere autenticación)
#   PROXY_PASSWORD → contraseña (solo si el proxy requiere autenticación)
http.proxy.enabled=${PROXY_ENABLED:false}
http.proxy.host=${PROXY_HOST:localhost}
http.proxy.port=${PROXY_PORT:8080}
http.proxy.user=${PROXY_USER:}
http.proxy.password=${PROXY_PASSWORD:}