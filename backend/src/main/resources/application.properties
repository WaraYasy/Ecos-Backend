# Server
server.port=8080

# Database PostgreSQL (lo configuraremos con Docker después)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecos_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# APIs externas (usaremos variables de entorno)
spotify.client.id=${SPOTIFY_CLIENT_ID:}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:}
spotify.redirect.uri=http://localhost:8080/api/auth/spotify/callback

lastfm.api.key=${LASTFM_API_KEY:}
lastfm.shared.secret=${LASTFM_SHARED_SECRET:}

tmdb.api.key=${TMDB_API_KEY:}

# AI Service
ai.service.url=http://localhost:8000